# Salty KMP server + Postgres for a home-server Docker deploy.
# All settings/secrets are written DIRECTLY in this file — no .env needed. EDIT every CHANGE_ME_*
# value before deploying. HTTPS is handled by your own NGINX reverse proxy on the host (the app is
# bound to 127.0.0.1 only).
#
# This is the committed TEMPLATE. Copy it — the copy holds real secrets and is gitignored:
#   cp docker-compose.example.yml docker-compose.yml   # then edit the CHANGE_ME_* values
#
#   1) ./gradlew :server:buildFatJar     (on a machine with JDK 21 + Android SDK)
#   2) edit the CHANGE_ME_* values in your copy
#   3) docker compose up -d --build
#
# For an internet-free target machine, see "Offline deploy" in DEPLOY.md
# (+ docker-compose.offline.example.yml).

# Values used by more than one service are defined once here and referenced with *aliases below.
# (Top-level "x-" keys are ignored by Compose; they only hold the anchors.)
x-vars:
  db-name: &db-name "salty"
  db-user: &db-user "salty"
  db-password: &db-password "CHANGE_ME_db_password"

# Cap container log files so a request flood (e.g. a login brute-force attempt) can't fill the host disk —
# Docker's default json-file driver is otherwise unbounded. 3 rotated files x 10 MB per service.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Postgres 18. UPGRADING FROM 17? The data is NOT carried over automatically — 18 changed both the
    # image layout (volume is now /var/lib/postgresql, PGDATA is /var/lib/postgresql/18/docker) and the
    # on-disk format, so 18 starts EMPTY. Recommended path is to drop the old volume and re-sync from a
    # known-good client. If you want to keep 17 as a rollback, give 18 its own volume name here (e.g.
    # salty-db18) BEFORE first start — see "Upgrading Postgres" in DEPLOY.md.
    image: postgres:18
    logging: *default-logging
    environment:
      POSTGRES_DB: *db-name
      POSTGRES_USER: *db-user
      POSTGRES_PASSWORD: *db-password
    volumes:
      # 18+ mounts the parent dir (not .../data) so a future pg_upgrade can use the fast --link path.
      - salty-db:/var/lib/postgresql
    healthcheck:
      # Keep -U / -d in sync with db-user / db-name above.
      test: ["CMD-SHELL", "pg_isready -U salty -d salty"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: ./server
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      # Host is the "db" service name; keep the database name in sync with db-name above.
      SALTY_DB_URL: "jdbc:postgresql://db:5432/salty"
      SALTY_DB_DRIVER: "org.postgresql.Driver"
      SALTY_DB_USER: *db-user
      SALTY_DB_PASSWORD: *db-password
      # Generate a long random value, e.g.  openssl rand -hex 32
      # REQUIRED: the server refuses to start if this is unset or left as a CHANGE_ME_/dev placeholder,
      # so an unedited deploy can't silently accept device sync tokens forged against a publicly known
      # key. (Local dev only: SALTY_ALLOW_DEFAULT_SECRET=true downgrades that to a warning — never in
      # production.) Renamed from SALTY_JWT_SECRET, which is still read as a fallback: if you are
      # upgrading, rename the variable but KEEP ITS VALUE — it keys every enrolled device's token, so
      # a new value signs every client out.
      SALTY_TOKEN_SECRET: "CHANGE_ME_long_random_token_secret"
      # Separate secret for the web-UI session cookie's MAC (key separation from the sync-token key).
      # REQUIRED and distinct: generate its own value, e.g.  openssl rand -hex 32
      SALTY_SESSION_SECRET: "CHANGE_ME_long_random_session_secret"
      # Seeded ONLY on first run, when the users table is empty. Also refused if left as a placeholder.
      SALTY_DEFAULT_USER: "admin"
      SALTY_DEFAULT_PASSWORD: "CHANGE_ME_admin_password"
      SALTY_IMAGE_DIR: "/data/images"
      # This file's design: the server sits behind your TLS-terminating reverse proxy, bound to loopback.
      #  - SALTY_TRUST_PROXY makes the app read the real client IP from X-Forwarded-For so the login
      #    brute-force throttle keys on the actual client, not the proxy's single IP. Only safe because the
      #    app is bound to loopback below (not directly reachable) — otherwise a client could spoof its IP.
      #  - SALTY_SECURE_COOKIES (web-UI session cookie sent over HTTPS only) defaults to SALTY_TRUST_PROXY,
      #    so enabling the proxy also turns it on. For plain-HTTP LAN/testing, set SALTY_TRUST_PROXY: "false"
      #    (or remove it) AND publish on all interfaces (see the ports note below).
      SALTY_TRUST_PROXY: "true"
    volumes:
      - salty-images:/data/images
    # Bound to loopback: reachable only through the host's reverse proxy (this file's NGINX + TLS design).
    # For plain-HTTP LAN/testing with direct access at http://<host-ip>:8080, use "8080:8080" instead
    # (and turn off SALTY_TRUST_PROXY above so the app doesn't trust spoofable forwarded headers).
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  salty-db:
  salty-images:
