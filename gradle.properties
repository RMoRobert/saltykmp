#Project
# Single source of truth for the app/server version. Read by server and composeApp build scripts
# (Android versionCode is derived from it there too).
# For iOS: ALSO CHANGE IN iosApp/Configuration/Config.xcconfig (reads MARKETING_VERSION there) to keep in sync!
appVersion=3.3.101
#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# The daemon's JDK is pinned in gradle/gradle-daemon-jvm.properties, NOT here. It used to be an
# `org.gradle.java.home` absolute path, which only ever matched one machine: this file travels with the
# project, so the Mac's path made `./gradlew` unusable on Windows and Linux. The criteria file states the
# VERSION instead, and each machine's Gradle finds or downloads a matching JDK (the foojay resolver in
# settings.gradle.kts does the downloading). Change it with `./gradlew updateDaemonJvm --jvm-version=NN`.
#
# The pin still matters for the reason it always did: the bundled Kotlin/Gradle can't parse a JDK 25
# version string and dies with a cryptic "IllegalArgumentException: 25.0.2", so a shell defaulting to
# JDK 25 would otherwise break the build.

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true