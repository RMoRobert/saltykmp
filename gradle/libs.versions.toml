[versions]
playwright = "1.63.0" # 1.57 swapped Chromium for Chrome for Testing; nothing removed since 1.52 is used
# here (no Page#accessibility, no _react/_vue/:light selectors, no devtools option). 1.63 annotated the
# Java API with JSpecify, so Kotlin now sees a nullable type wherever a value can be absent -- in
# ReactUiSmokeTest that was `boundingBox()` (null when not visible) and `waitForSelector()`.
agp = "9.1.1" # The ceiling is the IDEs, not the build. IntelliJ IDEA 2026.2.x's Android plugin knows AGP 9.1
# (it accepts any 9.1.x and refuses 9.2+ at sync with "Latest supported version is AGP 9.1.0"), and Android
# Studio Panda 4 knows 9.2. 9.1.1 is also the first AGP that supports compileSdk 37 and is the floor Compose
# 1.12 asks for (minAndroidGradlePluginVersion=9.1.0), and it sits inside KGP 2.4.20's certified 8.5.2-9.3.1.
# Move up when the IntelliJ Android plugin's Marketplace notes claim "support for Android Gradle Plugin 9.2/9.3".
#
# AGP 9 no longer lets com.android.application/library share a module with kotlin-multiplatform, which is why
# the Android entry point lives in :androidApp and :composeApp/:shared use com.android.kotlin.multiplatform.library.
#
# The Gradle wrapper (gradle/wrapper/gradle-wrapper.properties, which can't hold a comment that survives
# `gradlew wrapper`) is 9.5.1, chosen to sit inside what the rest of the stack tests: AGP 9.1.1 needs >= 9.3.1,
# Compose 1.12's plugin tests 9.3.1 and 9.5.0 (with AGP 9.1.1 and 9.2.0), Hot Reload 1.2.0 tests 9.5.1, and
# KGP 2.4.20 certifies up to 9.7.0. NOT 9.7+: IntelliJ 2026.2 switches to its "resilient model fetch" for
# Gradle >= 9.7 (registry gradle.use.resilient.model.fetch) and then reports every optional model a project
# does not provide -- CocoaPods, Hot Reload, SQLDelight -- as a failure, so every sync ends "failed" (seen
# 2026-09-24 on 9.7.1; the build itself was fine). Move on once a sync against 9.7+ comes back clean.
android-compileSdk = "36" # 37 builds on AGP 9.1.1, but only the Compose 1.12 line needs it (see composeMultiplatform),
# and IntelliJ 2026.2's Android plugin knows API 36 at most.
android-minSdk = "24"
android-targetSdk = "36" # when compileSdk moves to 37, keep this at 36 unless API 37's behaviour changes are wanted:
# raising it opts every user into them, which is a product decision rather than part of a toolchain bump.
androidx-activity = "1.13.0"
androidx-lifecycle = "2.10.0" # 2.11.0 moves with Compose 1.12 (see composeMultiplatform for why that is held back);
# it needs compileSdk 37 and AGP 9.1.0, and built and passed every test that way on 2026-09-24. When judging a bump, do not read the aar-metadata of the JetBrains artifact: 2.11.0's
# `org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose-android` claimed minCompileSdk=34 and AGP 8.1.1,
# while the *Google* artifact it depends on (`androidx.lifecycle:lifecycle-runtime-compose-android`) needed
# compileSdk 37 and AGP 9.1.0. Just try the bump and read what checkDebugAarMetadata says.
androidx-testExt = "1.3.0"
androidx-test-runner = "1.7.0"
composeHotReload = "1.2.0"
composeMultiplatform = "1.11.1" # 1.11 is what native iOS text input needs (see NativeTextInput.kt), and 1.11
# in turn needed Kotlin 2.4: 1.11.x ICEd the Kotlin/Native 2.3.21 backend (AutoboxingTransformer, MetalRedrawer.ios.kt).
#
# NOT 1.12.x -- tried 1.12.1 on 2026-09-24. The toolchain chain that used to block it is gone (AGP 9.1.1, Gradle 9,
# the :androidApp split; compileSdk 37 builds), and every test passed. But the iOS app CRASHES on hardware-keyboard
# input (iPad and Bluetooth keyboards; the simulator types this way too): 1.12's BaseComposeScene.sendKeyEvent now
# ends in FrameRecomposer.performTrampolineDispatch() -> FlushCoroutineDispatcher.flush(), and a re-entrant flush on
# the same thread clears the batch the outer flush is iterating -> uncaught kotlin.ConcurrentModificationException,
# SIGABRT. Reproduced twice, in fresh processes, typing into the recipe editor's Name field. 1.11's sendKeyEvent
# calls recomposer.performScheduledEffects() instead and never reaches flush() on a key press.
# Upstream: CMP-10674 (flush() is not re-entrancy-safe; open, also reported from production on 1.12.0); the code is
# unchanged in 1.13.0-alpha01. Retry when that is fixed. compileSdk -> 37, material3 -> the matching 1.12 alpha,
# androidx-lifecycle -> 2.11.0, navigationevent -> 1.1.x and filekit -> 0.16.x move with it; the only source change
# 1.12 needed was ChefScreen's rememberModalBottomSheetState -> rememberBottomSheetState(initialValue = Hidden).
# 1.12's klibs are built with Kotlin 2.3.20, so the 2.4.20 compiler reads them.
kotlin = "2.4.20" # KGP 2.4.20 certifies Gradle 7.6.3-9.7.0 and AGP 8.5.2-9.3.1 (it enforces only the
# minimums, so newer is uncertified rather than refused). Ktor 3.6.x klibs are built with 2.3.21, and a newer
# compiler reads older klibs fine -- it is the other direction that breaks, which is what once pinned filekit
# and Compose.
# 2.4.20 also makes `when` compile to invokedynamic by default on a JVM 21 target, i.e. the server.
kotlinx-coroutines = "1.11.0" # keep in sync with coroutinesVersion below
ktor = "3.6.0"
logback = "1.6.3" # 1.5.25/1.5.33/1.5.34/1.5.37 fixed class-instantiation + object-injection advisories
# (1.5.37 dropped Janino conditionals outright). 1.6.0 only removed long-deprecated API and moved to SLF4J
# 2.0.18; server/src/main/resources/logback.xml is a plain ConsoleAppender + pattern encoder, so none of it applies.
material3 = "1.11.0-alpha07" # JetBrains Compose material3; keep on the same minor line as composeMultiplatform
# (the last stable JetBrains material3 was 1.9.0; every line since has shipped as alphas alongside Compose).
coroutinesVersion = "1.11.0" # keep in sync with kotlinx-coroutines above
dateTimeVersion = "0.8.0-0.6.x-compat" # the compat build (0.8.0's API plus the old kotlinx.datetime.Instant/Clock),
# because that is what every target runs anyway: Ktor 3.6 (ktor-openapi-schema) and Exposed 1.5 (exposed-core) are
# built against the compat line, and Gradle ranks "0.8.0-0.6.x-compat" above "0.8.0", so a plain 0.8.0 here lost
# every conflict. Declaring the version that actually runs keeps IntelliJ from seeing two: with plain 0.8.0 its
# model of :server held a compile-only 0.7.1-compat (from exposed-core) plus a runtime 0.8.0 (from :shared), kept
# the compile-only one, and launched ApplicationKt with no kotlinx-datetime at all -- NoClassDefFoundError:
# kotlinx/datetime/LocalDateTime out of Exposed's datetime columns (2026-09-24). Back to plain once Ktor and
# Exposed stop depending on the compat artifact (check `dependencyInsight --dependency kotlinx-datetime`).
koin = "4.2.2"
sqlDelight = "2.4.0"
exposed = "1.5.0"
hikari = "7.1.0" # 7.x is still Java 11 bytecode, so the server's JVM 21 target is unaffected. The one
# behaviour change between 6.2.1 and here is 6.3.2 retiring the getUsername()/getPassword() override on
# HikariDataSource -- DatabaseFactory configures a HikariConfig instead, so it never relied on that.
postgres = "42.7.13" # JDBC driver. 42.7.5+ is what fixes the metadata check for the RULE privilege, dropped in server 18.
h2 = "2.5.250" # same on-disk format as 2.4.240 in both directions (checked 2026-09-24 against a scratch
# file), so an existing salty-db/ dev database opens without the export/import that 2.1 -> 2.2 needed.
bcrypt = "0.10.2"
filekit = "0.15.0" # NOT 0.16.x: built against Compose 1.12, lifecycle 2.11 and compileSdk 37, so it moves with
# composeMultiplatform (see there). Its fixes (iOS camera/PHPicker, Linux portal dialogs) touch nothing this app
# calls. 0.14.x needed Kotlin 2.4. 0.14.2 dropped iosX64, which this project does not target -- only iosArm64 and iosSimulatorArm64.
#
# This is also what retired the Skiko pin that used to sit at the top of composeApp/build.gradle.kts.
# filekit 0.13 dragged Skiko's *classes* above the *native runtime* Compose 1.10 shipped, so every Skiko
# module was forced to 0.9.37.4 to keep the two in step. Since filekit 0.15 each release is built against
# the current Compose (0.15.0 + Compose 1.11.1 both ask for Skiko 0.144.6; 0.16.0 + 1.12.1 both ask for 0.150.1,
# checked on jvmRuntimeClasspath and iosSimulatorArm64CompileKlibraries 2026-09-24), so a force is not merely
# unnecessary but actively wrong:
# holding Skiko at 0.9.37.4 gave a *compiling* app that died on its first frame with
# `IrLinkageError: PictureRecorder.beginRecording` out of SurfaceMetalRedrawer. Check
# `dependencyInsight --dependency org.jetbrains.skiko` on both jvmRuntimeClasspath and an iOS klib
# configuration before reintroducing any pin here.
navigationevent = "1.0.1" # NavigationBackHandler, which replaced Compose's deprecated BackHandler. Keep it on the
# line that matches composeMultiplatform: 1.0.x for Compose 1.11 (whose ui-backhandler rides on the 1.0 core), and
# for 1.12+ the version its release notes list under "Navigation Event" (1.1.0 for 1.12).
jna = "5.19.1" # desktop only: Windows Credential Manager bindings (SecretStore.jvm.kt)

