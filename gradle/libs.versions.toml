[versions]
playwright = "1.62.0" # 1.57 swapped Chromium for Chrome for Testing; nothing removed since 1.52 is used
# here (no Page#accessibility, no _react/_vue/:light selectors, no devtools option).
agp = "8.13.2"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.19.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.10.0" # 2.11.0 requires AGP 9.1.0+ and compileSdk 37; revisit when this project moves to AGP 9.
# Confirmed still true 2026-09-03. Do not re-check this by reading the aar-metadata of the JetBrains
# artifact -- `org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose-android` claims minCompileSdk=34
# and AGP 8.1.1, which looks like the pin has expired. The real constraint rides in on the *Google*
# artifact it depends on, `androidx.lifecycle:lifecycle-runtime-compose-android:2.11.0`. Just try the
# bump and read what checkDebugAarMetadata says.
androidx-testExt = "1.3.0"
androidx-test-runner = "1.7.0"
composeHotReload = "1.2.0"
composeMultiplatform = "1.11.1" # was pinned to 1.10.x because 1.11.x ICEd the Kotlin/Native 2.3.21 backend
# (AutoboxingTransformer, MetalRedrawer.ios.kt); the Kotlin 2.4 bump below is what cleared that. 1.11 is also
# what native iOS text input needs -- see NativeTextInput.kt.
#
# NOT 1.12.x, and the reason is a chain rather than a single number. Compose 1.12's Android artifacts declare
# minCompileSdk=37 AND minAndroidGradlePluginVersion=9.1.0 (the 1.11 line asks 35 and has no AGP floor).
# AGP 9.x in turn requires Gradle 9.1.0+, and KGP 2.4.10 only certifies AGP up to 9.1.0 -- so the one
# combination that works today is AGP exactly 9.1.0 + Gradle 9.1.0-9.5.0 + compileSdk 37. The SDK platform
# itself is not the obstacle (android-37.0/37.1/37.2 and build-tools 37 are all published).
#
# What makes it a project rather than a bump is AGP 9 itself: it turns on built-in Kotlin by default, which
# every project must either migrate to or explicitly opt out of, and its android DSL classes now implement
# only the new public interfaces. androidx-lifecycle above is waiting on exactly the same chain, so the two
# move together or not at all.
junit = "4.13.2"
kotlin = "2.4.10" # KGP 2.4.x supports Gradle 7.6.3-9.5.0 and AGP 8.5.2-9.1.0, so Gradle 8.14.5 and AGP
# 8.13.2 both stay put. Ktor 3.5.x klibs are built with 2.3.21 and a newer compiler reads older klibs
# fine -- it is the other direction that breaks, which is what pinned filekit and Compose below.
kotlinx-coroutines = "1.11.0" # keep in sync with coroutinesVersion below
ktor = "3.5.2"
logback = "1.6.3" # 1.5.25/1.5.33/1.5.34/1.5.37 fixed class-instantiation + object-injection advisories
# (1.5.37 dropped Janino conditionals outright). 1.6.0 only removed long-deprecated API and moved to SLF4J
# 2.0.18; server/src/main/resources/logback.xml is a plain ConsoleAppender + pattern encoder, so none of it applies.
material3 = "1.11.0-alpha07" # JetBrains Compose material3; keep on the same minor line as composeMultiplatform
coroutinesVersion = "1.11.0" # keep in sync with kotlinx-coroutines above
dateTimeVersion = "0.8.0"
koin = "4.2.2"
sqlDelight = "2.3.2"
exposed = "1.5.0"
hikari = "7.1.0" # 7.x is still Java 11 bytecode, so the server's JVM 21 target is unaffected. The one
# behaviour change between 6.2.1 and here is 6.3.2 retiring the getUsername()/getPassword() override on
# HikariDataSource -- DatabaseFactory configures a HikariConfig instead, so it never relied on that.
postgres = "42.7.13" # JDBC driver. 42.7.5+ is what fixes the metadata check for the RULE privilege, dropped in server 18.
h2 = "2.4.240"
bcrypt = "0.10.2"
filekit = "0.15.0" # needed Kotlin 2.4 (0.14.x is built against it); unblocked by the kotlin bump above.
# 0.14.2 dropped iosX64, which this project does not target -- only iosArm64 and iosSimulatorArm64.
#
# This is also what retired the Skiko pin that used to sit at the top of composeApp/build.gradle.kts.
# filekit 0.13 dragged Skiko's *classes* above the *native runtime* Compose 1.10 shipped, so every Skiko
# module was forced to 0.9.37.4 to keep the two in step. filekit 0.15 is built against Compose 1.11.1, so
# both now ask for Skiko 0.144.6 on their own and the force is not merely unnecessary but actively wrong:
# holding Skiko at 0.9.37.4 gave a *compiling* app that died on its first frame with
# `IrLinkageError: PictureRecorder.beginRecording` out of SurfaceMetalRedrawer. Check
# `dependencyInsight --dependency org.jetbrains.skiko` on both jvmRuntimeClasspath and an iOS klib
# configuration before reintroducing any pin here.
jna = "5.19.1" # desktop only: Windows Credential Manager bindings (SecretStore.jvm.kt)

